<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix Clone</title>
</head>
<body>
   <div class="main">
        <nav>
            <span><img src="/assets/img/svg/logo.svg" alt="" width="150px"></span>
            <div>
                <select name="Lang" id="lang" style="width:70px; height:30px; border-radius: 5px;" >
                    <option value="English">English</option>
                    <option value="Hindi">हिन्दी</option>
                </select>
                <button style="color: white; background-color: red; width: 65px; height: 30px; border-radius: 5px;">Sign In</button>
            </div>
        </nav>
        
        <div class="box">
        </div>
        <div class="written">
            <h1>
            Unlimited movies,<br>
            shows, and more </h1>
            <p style="font-size: 20px; padding-left: 90px; padding-top: 10px; ;">
                Starts at ₹149. Cancel at any time.</p>
                <p style="font-size: 15px; padding-left: 5px; padding-top: 35px;">Ready to watch? Enter your email to create or restart your membership.</p>
                <input type="text" style="width: 350px; height: 40px; border-radius: 5px; background: transparent; padding-left: 10px;margin-top: 10px; border: 1px solid white;" placeholder="Email Address">
                <button style="background-color: red; width: 150px; height: 40px; border: 1px solid red; border-radius: 5px; color: white; font-size: 20px;">Get Started > </button>
        </div>
   </div>
</body>
</html>
